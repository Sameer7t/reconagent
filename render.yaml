services:
  # ReconAgent FastAPI Backend API Service
  - type: web
    name: reconagent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: reconagent-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  # Managed PostgreSQL Database for ReconAgent
  - name: reconagent-db
    databaseName: reconagent
    user: postgres
    plan: free
    region: oregon
