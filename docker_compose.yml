# =============================================================================
# ReconAgent Docker Compose Orchestration
# Architecture: Frontend (React/Nginx) -> Backend (FastAPI/LangGraph) -> Database (PostgreSQL 16)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Relational Datastore
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: reconagent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-reconagent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reconagent}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - reconagent-net

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend & Autonomous AI Investigation Engine
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reconagent-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@db:5432/${POSTGRES_DB:-reconagent}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-reconagent-super-secret-key}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - reconagent-net

  # ---------------------------------------------------------------------------
  # 3. Frontend Dashboard & Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reconagent-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - reconagent-net

# -----------------------------------------------------------------------------
# Persistent Volumes (Survives 'docker compose down' & 'docker compose up')
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: reconagent_postgres_data
  backend_data:
    name: reconagent_backend_data
  backend_logs:
    name: reconagent_backend_logs

# -----------------------------------------------------------------------------
# Internal Container Network
# -----------------------------------------------------------------------------
networks:
  reconagent-net:
    name: reconagent_network
    driver: bridge
